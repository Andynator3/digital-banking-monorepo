version: '3.8'

services:
  # 1. Base de données
  mysqldb:
    image: mysql:8.0
    container_name: digital-banking-mysql
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_HOST_PORT}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - banking-network

  # 2. Serveur Backend (Spring Boot)
  backend:
    build:
      context: ./digital-banking-backend
      dockerfile: Dockerfile
    container_name: digital-banking-backend
    restart: always
    ports:
      # On map le port défini dans le .env vers le port 8090 interne (celui de application.properties)
      - "${BACKEND_PORT}:8090"
    environment:
      # Ces variables écrasent ce qu'il y a dans votre application.properties
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysqldb:3306/${DB_NAME}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=${DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      # Injection de la clé secrète JWT depuis le fichier .env
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      - mysqldb
    networks:
      - banking-network

  # 3. Serveur Frontend (Angular)
  frontend:
    build:
      context: ./digital-banking-frontend
      dockerfile: Dockerfile
    container_name: digital-banking-frontend
    restart: always
    ports:
      - "${FRONTEND_PORT}:80"
    depends_on:
      - backend
    networks:
      - banking-network

networks:
  banking-network:
    driver: bridge

volumes:
  mysql_data:
