name: 2. IaC - Infrastructure Provisioning

# Ce pipeline se déclenche uniquement si on modifie le dossier Terraform/IaC
# Ou manuellement (workflow_dispatch)
on:
  push:
    branches: [ "main" ]
    paths:
      - 'infra/terraform/**'
  workflow_dispatch:

jobs:
  terraform-plan-apply:
    name: Terraform Plan & Apply
    runs-on: ubuntu-latest
    # Définition du répertoire contenant le code d'infrastructure
    defaults:
      run:
        working-directory: ./infra/terraform

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.0
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }} # Optionnel (si Terraform Cloud)

      - name: Terraform Format
        id: fmt
        run: terraform fmt -check

      - name: Terraform Init
        id: init
        run: terraform init
        env:
          # Identifiants Cloud (AWS, Azure, GCP, etc.)
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Terraform Plan
        id: plan
        run: terraform plan -no-color
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      # L'Apply ne s'exécute QUE si le Plan réussit ET qu'on est sur la branche principale
      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -auto-approve
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}