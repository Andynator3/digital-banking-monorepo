<div class="container d-flex justify-content-center align-items-center vh-100">
  <div class="card shadow p-4" style="width: 400px; border-radius: 15px;">

    <div class="text-center mb-4">
      <i class="bi bi-bank text-primary" style="font-size: 3rem;"></i>
      <h3 class="mt-2">E-Banking</h3>
      <p class="text-muted">Authentification sécurisée</p>
    </div>

    <!-- Affichage des erreurs de connexion -->
    <div *ngIf="errorMessage" class="alert alert-danger text-center">
      <i class="bi bi-exclamation-triangle-fill"></i> {{ errorMessage }}
    </div>

    <!-- Le formulaire lié à notre formLogin -->
    <form [formGroup]="formLogin" (ngSubmit)="handleLogin()">

      <div class="mb-3">
        <label for="username" class="form-label fw-bold">Identifiant</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-person"></i></span>
          <input type="text" id="username" class="form-control" formControlName="username" placeholder="Entrez votre identifiant">
        </div>
      </div>

      <div class="mb-4">
        <label for="password" class="form-label fw-bold">Mot de passe</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-lock"></i></span>
          <input type="password" id="password" class="form-control" formControlName="password" placeholder="Entrez votre mot de passe">
        </div>
      </div>

      <button type="submit" class="btn btn-primary w-100 mb-3 py-2" [disabled]="formLogin.invalid">
        <i class="bi bi-box-arrow-in-right"></i> Se connecter
      </button>

    </form>
  </div>
</div>
